name: Security Audit

on:
  push:
    branches: [main, bevy-0.19, bevy-0.18]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main, bevy-0.19, bevy-0.18]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Default-deny: each job opts in to the minimum permissions it needs.
permissions: {}

# Avoid running duplicate audits when PRs are pushed rapidly.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # Keep this list in sync with the [advisories] ignore list in deny.toml.
        #
        # RUSTSEC-2024-0436 (unmaintained `paste`) was previously ignored here and
        # has been removed — `paste` no longer appears in Cargo.lock on Bevy 0.20,
        # and a stale entry makes cargo-audit error.
        #
        # RUSTSEC-2026-0344 (ruzstd decompression bomb) and RUSTSEC-2026-0192
        # (ttf-parser unmaintained) cannot be resolved from this repo: both are
        # transitive dependencies of Bevy pinned below the fix. See the
        # [advisories] section of deny.toml for the full dependency chains and
        # the condition that clears each one.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0344
          --ignore RUSTSEC-2026-0192

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check bans
        run: cargo deny check bans

      - name: Check advisories
        run: cargo deny check advisories

      - name: Check sources
        run: cargo deny check sources
